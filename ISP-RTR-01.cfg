! =============================================================
! PROJECT: TY B.Sc. IT Network Security - NS-P01
! ORGANIZATION: Global Hope Foundation (GHF)
! DEVICE: ISP-RTR-01 (Internet Backbone Simulator)
! HARDWARE: Cisco 2911 Router + HWIC-2FE in Slot 0
! =============================================================
hostname ISP-RTR-01
no ip domain-lookup
!
interface GigabitEthernet0/0
 description WAN-Link to HQ Perimeter (HQ-RTR-01 Gi0/0)
 ip address 203.0.113.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description WAN-Link to Remote Office 1 (RO1-RTR-01 Gi0/0)
 ip address 203.0.113.5 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description WAN-Link to Remote Office 2 (RO2-RTR-01 Gi0/0)
 ip address 203.0.113.9 255.255.255.252
 no shutdown
!
! Note: HWIC-2FE installed in Slot 0. If HWIC-2FE is unavailable,
! see documentation for intermediate switch arrangement.
interface FastEthernet0/0/0
 description Simulated Public Internet Network (EXT-CLIENT-01)
 ip address 203.0.113.17 255.255.255.240
 no shutdown
!
! Public routing to HQ DMZ NAT addresses
ip route 203.0.113.100 255.255.255.255 203.0.113.2
ip route 203.0.113.101 255.255.255.255 203.0.113.2
!
line con 0
 logging synchronous
line vty 0 4
 login
!
end
