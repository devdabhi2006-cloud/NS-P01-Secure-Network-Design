! =============================================================
! PROJECT: TY B.Sc. IT Network Security - NS-P01
! ORGANIZATION: Global Hope Foundation (GHF)
! DEVICE: RO1-RTR-01 (Remote Office 1 Edge & VPN Spoke)
! HARDWARE: Cisco 2911 Router
! =============================================================
hostname RO1-RTR-01
no ip domain-lookup
ip domain-name globalhope.org
service password-encryption
enable secret SecretPass2026!
!
username admin_ghf privilege 15 secret AdminPass2026!
crypto key generate rsa modulus 1024
!
ip access-list standard MGMT-VTY-ACL
 permit 10.1.30.0 0.0.0.255
 permit 10.2.10.0 0.0.0.255
!
line con 0
 exec-timeout 5 0
 logging synchronous
 login local
line vty 0 4
 access-class MGMT-VTY-ACL in
 transport input ssh
 exec-timeout 5 0
 login local
!
banner motd ^C
=============================================================
  UNAUTHORIZED ACCESS TO GLOBAL HOPE FOUNDATION IS PROHIBITED
=============================================================
^C
!
! --- INTERFACES ---
interface GigabitEthernet0/0
 description WAN-Link to ISP (ISP-RTR-01 Gi0/1)
 ip address 203.0.113.6 255.255.255.252
 ip nat outside
 crypto map RO1-MAP
 no shutdown
!
interface GigabitEthernet0/1
 description RO1 Branch LAN Gateway (RO1-SW-01 Fa0/24)
 ip address 10.2.10.1 255.255.255.0
 ip access-group RO1-LAN-FILTER-IN in
 ip nat inside
 no shutdown
!
! --- ROUTING ---
ip route 0.0.0.0 0.0.0.0 203.0.113.5
!
! --- NAT / PAT IMPLEMENTATION ---
ip access-list extended RO1-NAT-ACL
 remark --- Bypass NAT for VPN Traffic to HQ ---
 deny ip 10.2.10.0 0.0.0.255 10.1.0.0 0.0.255.255
 remark --- Local Breakout PAT for Branch Internet Access ---
 permit ip 10.2.10.0 0.0.0.255 any
!
ip nat inside source list RO1-NAT-ACL interface GigabitEthernet0/0 overload
!
! --- ACCESS CONTROL LISTS ---
ip access-list extended RO1-LAN-FILTER-IN
 remark --- Allow Intranet Web & File Access at HQ ---
 permit tcp 10.2.10.0 0.0.0.255 host 10.1.40.10 eq 80
 permit tcp 10.2.10.0 0.0.0.255 host 10.1.40.10 eq 443
 permit tcp 10.2.10.0 0.0.0.255 host 10.1.40.10 eq 445
 remark --- Allow Relief Operators to sync with Beneficiary Medical DB API ---
 permit tcp 10.2.10.0 0.0.0.255 host 10.1.40.30 eq 443
 remark --- Allow Remote Telemetry to Central Syslog Server ---
 permit udp 10.2.10.0 0.0.0.255 host 10.1.40.50 eq 514
 remark --- Explicitly Block Remote Office from HQ Financial/Donor DB ---
 deny ip 10.2.10.0 0.0.0.255 host 10.1.40.20
 remark --- Explicitly Block Remote Office from HQ IT Management Subnet ---
 deny ip 10.2.10.0 0.0.0.255 10.1.30.0 0.0.0.255
 remark --- Allow Local Internet Web Browsing & DNS (Local Breakout) ---
 permit tcp 10.2.10.0 0.0.0.255 any eq 80
 permit tcp 10.2.10.0 0.0.0.255 any eq 443
 permit udp 10.2.10.0 0.0.0.255 any eq 53
 permit icmp 10.2.10.0 0.0.0.255 any
 deny ip any any
!
! --- IPSEC VPN CRYPTOGRAPHIC POLICY ---
crypto isakmp policy 10
 encr aes 256
 hash sha
 authentication pre-share
 group 2
 lifetime 86400
!
crypto isakmp key GlobalHopeVPN2026! address 203.0.113.2
!
crypto ipsec transform-set GHF-TRANSFORM esp-aes 256 esp-sha-hmac
!
ip access-list extended VPN-TRAFFIC-HQ
 permit ip 10.2.10.0 0.0.0.255 10.1.0.0 0.0.255.255
!
crypto map RO1-MAP 10 ipsec-isakmp
 set peer 203.0.113.2
 set transform-set GHF-TRANSFORM
 set pfs group2
 match address VPN-TRAFFIC-HQ
!
end
