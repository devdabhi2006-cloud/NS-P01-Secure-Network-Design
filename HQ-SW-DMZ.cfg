! =============================================================
! PROJECT: TY B.Sc. IT Network Security - NS-P01
! ORGANIZATION: Global Hope Foundation (GHF)
! DEVICE: HQ-SW-DMZ (DMZ Access Layer Switch)
! HARDWARE: Cisco Catalyst 2960-24TT
! =============================================================
hostname HQ-SW-DMZ
no ip domain-lookup
service password-encryption
enable secret SecretPass2026!
username admin_ghf privilege 15 secret AdminPass2026!
!
interface FastEthernet0/1
 description SRV-WEB-DMZ (Public Web & Donation Portal)
 switchport mode access
 switchport access vlan 1
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/2
 description SRV-DNS-DMZ (Public Authoritative DNS)
 switchport mode access
 switchport access vlan 1
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/24
 description Uplink to HQ-RTR-01 Gi0/2
 switchport mode access
 switchport access vlan 1
 no shutdown
!
interface Vlan1
 description Management SVI
 ip address 10.1.50.2 255.255.255.240
 no shutdown
!
ip default-gateway 10.1.50.1
!
line con 0
 login local
line vty 0 4
 login local
!
end
