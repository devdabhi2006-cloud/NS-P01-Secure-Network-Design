! =============================================================
! PROJECT: TY B.Sc. IT Network Security - NS-P01
! ORGANIZATION: Global Hope Foundation (GHF)
! DEVICE: HQ-CORE-3560 (HQ L3 Collapsed Core Switch)
! HARDWARE: Cisco Catalyst 3560-24PS
! =============================================================
hostname HQ-CORE-3560
no ip domain-lookup
ip domain-name globalhope.org
service password-encryption
enable secret SecretPass2026!
!
username admin_ghf privilege 15 secret AdminPass2026!
crypto key generate rsa modulus 1024
!
ip routing
!
! --- VLAN DEFINITIONS ---
vlan 10
 name VLAN_STAFF
vlan 20
 name VLAN_FIN
vlan 30
 name VLAN_IT
vlan 40
 name VLAN_SRV
!
! --- ROUTED UPLINK TO PERIMETER ROUTER ---
interface GigabitEthernet0/1
 description Routed Uplink to HQ Perimeter Router (HQ-RTR-01 Gi0/1)
 no switchport
 ip address 10.1.99.2 255.255.255.252
 no shutdown
!
! --- SWITCHED VIRTUAL INTERFACES (SVIs) WITH ACLS ---
interface Vlan10
 description SVI Gateway General Staff
 ip address 10.1.10.1 255.255.255.0
 ip access-group STAFF-FILTER-IN in
 no shutdown
!
interface Vlan20
 description SVI Gateway HR & Finance
 ip address 10.1.20.1 255.255.255.0
 ip access-group FINANCE-FILTER-IN in
 no shutdown
!
interface Vlan30
 description SVI Gateway IT Management
 ip address 10.1.30.1 255.255.255.0
 ip access-group IT-MGMT-FILTER-IN in
 no shutdown
!
interface Vlan40
 description SVI Gateway Protected Server Farm
 ip address 10.1.40.1 255.255.255.0
 ip access-group SERVER-FARM-IN in
 no shutdown
!
! --- TRUNK PORTS TO ACCESS SWITCHES ---
interface FastEthernet0/1
 description Trunk to HQ-SW-STAFF Fa0/24
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,30
 no shutdown
!
interface FastEthernet0/2
 description Trunk to HQ-SW-FIN Fa0/24
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 20,30
 no shutdown
!
interface FastEthernet0/3
 description Trunk to HQ-SW-IT Fa0/24
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 30
 no shutdown
!
interface GigabitEthernet0/2
 description Trunk to HQ-SW-SRV Fa0/24
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 40,30
 no shutdown
!
! --- ROUTING ---
ip route 0.0.0.0 0.0.0.0 10.1.99.1
!
! --- ACCESS CONTROL LISTS ---
ip access-list extended STAFF-FILTER-IN
 remark --- Allow DHCP to Gateway/Server ---
 permit udp any eq 68 any eq 67
 remark --- Allow Core Telemetry to Management/Log Server ---
 permit udp 10.1.10.0 0.0.0.255 host 10.1.40.50 eq 514
 permit udp 10.1.10.0 0.0.0.255 host 10.1.40.50 eq 123
 remark --- Allow Intranet Web Portal and File Sharing ---
 permit tcp 10.1.10.0 0.0.0.255 host 10.1.40.10 eq 80
 permit tcp 10.1.10.0 0.0.0.255 host 10.1.40.10 eq 443
 permit tcp 10.1.10.0 0.0.0.255 host 10.1.40.10 eq 21
 permit tcp 10.1.10.0 0.0.0.255 host 10.1.40.10 eq 445
 remark --- Explicitly Block Staff from Confidential Financial & Donor DB ---
 deny ip 10.1.10.0 0.0.0.255 host 10.1.40.20
 remark --- Explicitly Block Staff from Beneficiary & Medical Records DB ---
 deny ip 10.1.10.0 0.0.0.255 host 10.1.40.30
 remark --- Explicitly Block Staff from HR/Finance Subnet (Lateral Movement) ---
 deny ip 10.1.10.0 0.0.0.255 10.1.20.0 0.0.0.255
 remark --- Explicitly Block Staff from IT Management Subnet ---
 deny ip 10.1.10.0 0.0.0.255 10.1.30.0 0.0.0.255
 remark --- Allow Staff to browse DMZ Web & DNS ---
 permit tcp 10.1.10.0 0.0.0.255 host 10.1.50.10 eq 80
 permit tcp 10.1.10.0 0.0.0.255 host 10.1.50.10 eq 443
 permit udp 10.1.10.0 0.0.0.255 host 10.1.50.11 eq 53
 remark --- Allow Outbound Internet Web & DNS ---
 permit tcp 10.1.10.0 0.0.0.255 any eq 80
 permit tcp 10.1.10.0 0.0.0.255 any eq 443
 permit udp 10.1.10.0 0.0.0.255 any eq 53
 permit icmp 10.1.10.0 0.0.0.255 any
 deny ip any any
!
ip access-list extended FINANCE-FILTER-IN
 remark --- Allow DHCP and Syslog/NTP ---
 permit udp any eq 68 any eq 67
 permit udp 10.1.20.0 0.0.0.255 host 10.1.40.50 eq 514
 permit udp 10.1.20.0 0.0.0.255 host 10.1.40.50 eq 123
 remark --- Allow Access to Intranet/File Server ---
 permit tcp 10.1.20.0 0.0.0.255 host 10.1.40.10 eq 80
 permit tcp 10.1.20.0 0.0.0.255 host 10.1.40.10 eq 443
 permit tcp 10.1.20.0 0.0.0.255 host 10.1.40.10 eq 445
 remark --- Allow Authorized SQL Access to Donor & Financial DB Server ---
 permit tcp 10.1.20.0 0.0.0.255 host 10.1.40.20 eq 1433
 permit tcp 10.1.20.0 0.0.0.255 host 10.1.40.20 eq 3306
 permit tcp 10.1.20.0 0.0.0.255 host 10.1.40.20 eq 443
 remark --- Block Finance from Beneficiary Medical Records DB ---
 deny ip 10.1.20.0 0.0.0.255 host 10.1.40.30
 remark --- Block Finance from Staff and IT Subnets ---
 deny ip 10.1.20.0 0.0.0.255 10.1.10.0 0.0.0.255
 deny ip 10.1.20.0 0.0.0.255 10.1.30.0 0.0.0.255
 remark --- Allow Outbound Internet & DMZ ---
 permit tcp 10.1.20.0 0.0.0.255 host 10.1.50.10 eq 80
 permit tcp 10.1.20.0 0.0.0.255 host 10.1.50.10 eq 443
 permit udp 10.1.20.0 0.0.0.255 host 10.1.50.11 eq 53
 permit tcp 10.1.20.0 0.0.0.255 any eq 80
 permit tcp 10.1.20.0 0.0.0.255 any eq 443
 permit udp 10.1.20.0 0.0.0.255 any eq 53
 permit icmp 10.1.20.0 0.0.0.255 any
 deny ip any any
!
ip access-list extended IT-MGMT-FILTER-IN
 remark --- IT Administrative Zone: Full Management Authority ---
 permit ip 10.1.30.0 0.0.0.255 any
!
ip access-list extended SERVER-FARM-IN
 remark --- Allow Syslog & NTP outbound from servers to Logging Host ---
 permit udp 10.1.40.0 0.0.0.255 host 10.1.40.50 eq 514
 permit udp 10.1.40.0 0.0.0.255 host 10.1.40.50 eq 123
 remark --- Permit Established Responses to Internal Users ---
 permit tcp 10.1.40.0 0.0.0.255 10.1.0.0 0.0.255.255 established
 permit tcp 10.1.40.0 0.0.0.255 10.2.0.0 0.0.255.255 established
 permit tcp 10.1.40.0 0.0.0.255 10.3.0.0 0.0.255.255 established
 remark --- Deny Servers from Initiating New Sessions into User Networks ---
 deny ip 10.1.40.0 0.0.0.255 10.1.10.0 0.0.0.255
 deny ip 10.1.40.0 0.0.0.255 10.1.20.0 0.0.0.255
 deny ip 10.1.40.0 0.0.0.255 10.1.30.0 0.0.0.255
 remark --- Allow Outbound OS Updates/Patches via Edge NAT ---
 permit tcp 10.1.40.0 0.0.0.255 any eq 80
 permit tcp 10.1.40.0 0.0.0.255 any eq 443
 permit udp 10.1.40.0 0.0.0.255 any eq 53
 permit icmp 10.1.40.0 0.0.0.255 any
 deny ip any any
!
! --- LINE ACCESS ---
ip access-list standard MGMT-VTY-ACL
 permit 10.1.30.0 0.0.0.255
!
line con 0
 exec-timeout 5 0
 logging synchronous
 login local
line vty 0 4
 access-class MGMT-VTY-ACL in
 transport input ssh
 exec-timeout 5 0
 login local
!
end
