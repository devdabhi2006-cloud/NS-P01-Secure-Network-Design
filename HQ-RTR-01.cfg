! =============================================================
! PROJECT: TY B.Sc. IT Network Security - NS-P01
! ORGANIZATION: Global Hope Foundation (GHF)
! DEVICE: HQ-RTR-01 (HQ Perimeter Edge, NAT & IPsec Hub)
! HARDWARE: Cisco 2911 Router
! =============================================================
hostname HQ-RTR-01
no ip domain-lookup
ip domain-name globalhope.org
service password-encryption
enable secret SecretPass2026!
!
username admin_ghf privilege 15 secret AdminPass2026!
crypto key generate rsa modulus 1024
!
ip access-list standard MGMT-VTY-ACL
 permit 10.1.30.0 0.0.0.255
!
line con 0
 exec-timeout 5 0
 logging synchronous
 login local
line vty 0 4
 access-class MGMT-VTY-ACL in
 transport input ssh
 exec-timeout 5 0
 login local
!
banner motd ^C
=============================================================
  UNAUTHORIZED ACCESS TO GLOBAL HOPE FOUNDATION IS PROHIBITED
=============================================================
^C
!
! --- INTERFACES ---
interface GigabitEthernet0/0
 description WAN-Outside-Untrusted (ISP-RTR-01 Gi0/0)
 ip address 203.0.113.2 255.255.255.252
 ip access-group WAN-TO-DMZ-IN in
 ip nat outside
 crypto map GHF-HQ-MAP
 no shutdown
!
interface GigabitEthernet0/1
 description Inside-Transit-to-Core-Switch (HQ-CORE-3560 Gi0/1)
 ip address 10.1.99.1 255.255.255.252
 ip nat inside
 no shutdown
!
interface GigabitEthernet0/2
 description DMZ-Network-Interface (HQ-SW-DMZ Fa0/24)
 ip address 10.1.50.1 255.255.255.240
 ip access-group DMZ-CONTAINMENT-IN in
 ip nat inside
 no shutdown
!
! --- ROUTING ---
ip route 0.0.0.0 0.0.0.0 203.0.113.1
ip route 10.1.0.0 255.255.0.0 10.1.99.2
ip route 10.2.10.0 255.255.255.0 203.0.113.1
ip route 10.3.10.0 255.255.255.0 203.0.113.1
!
! --- NAT / PAT IMPLEMENTATION ---
ip nat inside source static 10.1.50.10 203.0.113.100
ip nat inside source static 10.1.50.11 203.0.113.101
!
ip access-list extended HQ-NAT-ACL
 remark --- Bypass NAT for VPN Tunnels to Remote Offices ---
 deny ip 10.1.0.0 0.0.255.255 10.2.10.0 0.0.0.255
 deny ip 10.1.0.0 0.0.255.255 10.3.10.0 0.0.0.255
 remark --- Dynamic PAT for Internal Subnets Outbound to Internet ---
 permit ip 10.1.0.0 0.0.255.255 any
!
ip nat inside source list HQ-NAT-ACL interface GigabitEthernet0/0 overload
!
! --- ACCESS CONTROL LISTS ---
ip access-list extended WAN-TO-DMZ-IN
 remark --- Allow IPsec VPN Negotiation and ESP from RO1 & RO2 ---
 permit udp host 203.0.113.6 host 203.0.113.2 eq isakmp
 permit udp host 203.0.113.6 host 203.0.113.2 eq non500-isakmp
 permit esp host 203.0.113.6 host 203.0.113.2
 permit udp host 203.0.113.10 host 203.0.113.2 eq isakmp
 permit udp host 203.0.113.10 host 203.0.113.2 eq non500-isakmp
 permit esp host 203.0.113.10 host 203.0.113.2
 remark --- Allow Public Web Access to DMZ Web Server ---
 permit tcp any host 203.0.113.100 eq 80
 permit tcp any host 203.0.113.100 eq 443
 permit tcp any host 10.1.50.10 eq 80
 permit tcp any host 10.1.50.10 eq 443
 remark --- Allow Public DNS Queries to DMZ DNS Server ---
 permit udp any host 203.0.113.101 eq 53
 permit tcp any host 203.0.113.101 eq 53
 permit udp any host 10.1.50.11 eq 53
 permit tcp any host 10.1.50.11 eq 53
 remark --- Permit Established TCP Return Traffic from Outbound Staff Sessions ---
 permit tcp any any established
 remark --- Permit Inbound ICMP Echo-Reply ---
 permit icmp any any echo-reply
 deny ip any any
!
ip access-list extended DMZ-CONTAINMENT-IN
 remark --- Explicit Architectural Exception: Return Traffic to Internal LAN ---
 permit tcp host 10.1.50.10 eq 80 10.1.0.0 0.0.255.255 established
 permit tcp host 10.1.50.10 eq 443 10.1.0.0 0.0.255.255 established
 permit udp host 10.1.50.11 eq 53 10.1.0.0 0.0.255.255
 remark --- Strict Boundary: Deny DMZ from Initiating Sessions to Internal LANs ---
 deny ip 10.1.50.0 0.0.0.15 10.1.0.0 0.0.255.255
 deny ip 10.1.50.0 0.0.0.15 10.2.0.0 0.0.255.255
 deny ip 10.1.50.0 0.0.0.15 10.3.0.0 0.0.255.255
 remark --- Permit DMZ Servers Outbound DNS & Updates to External WAN ---
 permit udp host 10.1.50.11 any eq 53
 permit tcp host 10.1.50.10 any eq 80
 permit tcp host 10.1.50.10 any eq 443
 permit icmp host 10.1.50.10 any echo
 permit icmp host 10.1.50.11 any echo
 deny ip any any
!
! --- IPSEC VPN CRYPTOGRAPHIC POLICY ---
crypto isakmp policy 10
 encr aes 256
 hash sha
 authentication pre-share
 group 2
 lifetime 86400
!
crypto isakmp key GlobalHopeVPN2026! address 203.0.113.6
crypto isakmp key GlobalHopeVPN2026! address 203.0.113.10
!
crypto ipsec transform-set GHF-TRANSFORM esp-aes 256 esp-sha-hmac
!
ip access-list extended VPN-TRAFFIC-RO1
 permit ip 10.1.0.0 0.0.255.255 10.2.10.0 0.0.0.255
!
ip access-list extended VPN-TRAFFIC-RO2
 permit ip 10.1.0.0 0.0.255.255 10.3.10.0 0.0.0.255
!
crypto map GHF-HQ-MAP 10 ipsec-isakmp
 set peer 203.0.113.6
 set transform-set GHF-TRANSFORM
 set pfs group2
 match address VPN-TRAFFIC-RO1
!
crypto map GHF-HQ-MAP 20 ipsec-isakmp
 set peer 203.0.113.10
 set transform-set GHF-TRANSFORM
 set pfs group2
 match address VPN-TRAFFIC-RO2
!
end
