! =============================================================
! PROJECT: TY B.Sc. IT Network Security - NS-P01
! ORGANIZATION: Global Hope Foundation (GHF)
! DEVICE: RO2-SW-01 (Remote Office 2 Access Switch)
! HARDWARE: Cisco Catalyst 2960-24TT
! =============================================================
hostname RO2-SW-01
no ip domain-lookup
service password-encryption
enable secret SecretPass2026!
username admin_ghf privilege 15 secret AdminPass2026!
!
interface range FastEthernet0/1 - 10
 description RO2 Community Hub Workstations
 switchport mode access
 switchport access vlan 1
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/24
 description Uplink to RO2-RTR-01 Gi0/1
 switchport mode access
 switchport access vlan 1
 no shutdown
!
interface Vlan1
 description Management SVI
 ip address 10.3.10.2 255.255.255.0
 no shutdown
!
ip default-gateway 10.3.10.1
!
line con 0
 login local
line vty 0 4
 login local
!
end
