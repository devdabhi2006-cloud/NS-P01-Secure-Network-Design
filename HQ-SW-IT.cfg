! =============================================================
! PROJECT: TY B.Sc. IT Network Security - NS-P01
! ORGANIZATION: Global Hope Foundation (GHF)
! DEVICE: HQ-SW-IT (HQ IT & Management Access Switch)
! HARDWARE: Cisco Catalyst 2960-24TT
! =============================================================
hostname HQ-SW-IT
no ip domain-lookup
ip domain-name globalhope.org
service password-encryption
enable secret SecretPass2026!
username admin_ghf privilege 15 secret AdminPass2026!
crypto key generate rsa modulus 1024
!
vlan 30
 name VLAN_IT_MGMT
!
interface range FastEthernet0/1 - 10
 description IT & Security Management Workstations
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/24
 description Trunk to HQ-CORE-3560 Fa0/3
 switchport mode trunk
 switchport trunk allowed vlan 30
 no shutdown
!
interface Vlan30
 description Management SVI
 ip address 10.1.30.13 255.255.255.0
 no shutdown
!
ip default-gateway 10.1.30.1
!
ip access-list standard MGMT-VTY-ACL
 permit 10.1.30.0 0.0.0.255
!
line con 0
 login local
line vty 0 4
 access-class MGMT-VTY-ACL in
 transport input ssh
 login local
!
end
